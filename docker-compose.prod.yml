version: '3.8'

services:
  # Redis for queue and caching
  redis:
    image: redis:7-alpine
    container_name: grounding-dino-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - grounding-dino-network

  # FastAPI Web Server
  grounding-dino-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grounding-dino-api-prod
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_CACHE=/app/cache/transformers
      - HF_HOME=/app/cache/huggingface
      - ENABLE_QUEUE=true
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=production
    volumes:
      - model_cache:/app/cache
      - ./images:/app/images:ro
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
      replicas: 2  # Run 2 API instances for load balancing
    networks:
      - grounding-dino-network

  # Primary Celery Worker Pool
  grounding-dino-worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grounding-dino-worker-1
    environment:
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_CACHE=/app/cache/transformers
      - HF_HOME=/app/cache/huggingface
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=production
    volumes:
      - model_cache:/app/cache
    depends_on:
      - redis
    restart: unless-stopped
    command: ["celery", "-A", "queue_worker", "worker", "--loglevel=info", "--concurrency=1", "--queues=detection,health", "--hostname=worker1@%h"]
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    networks:
      - grounding-dino-network

  grounding-dino-worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grounding-dino-worker-2
    environment:
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_CACHE=/app/cache/transformers
      - HF_HOME=/app/cache/huggingface
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=production
    volumes:
      - model_cache:/app/cache
    depends_on:
      - redis
    restart: unless-stopped
    command: ["celery", "-A", "queue_worker", "worker", "--loglevel=info", "--concurrency=1", "--queues=detection", "--hostname=worker2@%h"]
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    networks:
      - grounding-dino-network

  grounding-dino-worker-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grounding-dino-worker-3
    environment:
      - PYTHONUNBUFFERED=1
      - TRANSFORMERS_CACHE=/app/cache/transformers
      - HF_HOME=/app/cache/huggingface
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ENVIRONMENT=production
    volumes:
      - model_cache:/app/cache
    depends_on:
      - redis
    restart: unless-stopped
    command: ["celery", "-A", "queue_worker", "worker", "--loglevel=info", "--concurrency=1", "--queues=detection", "--hostname=worker3@%h"]
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    networks:
      - grounding-dino-network

  # Flower for monitoring Celery
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grounding-dino-flower
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FLOWER_BASIC_AUTH=admin:secure_password_here  # Change in production
    depends_on:
      - redis
    restart: unless-stopped
    command: ["celery", "-A", "queue_worker", "flower", "--port=5555", "--url_prefix=flower"]
    networks:
      - grounding-dino-network

  # Nginx reverse proxy with load balancing
  nginx:
    image: nginx:alpine
    container_name: grounding-dino-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - grounding-dino-api
      - flower
    restart: unless-stopped
    networks:
      - grounding-dino-network

  # Optional: Redis monitoring
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
      - HTTP_USER=admin
      - HTTP_PASSWORD=secure_password_here  # Change in production
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - grounding-dino-network
    profiles:
      - monitoring

volumes:
  model_cache:
    driver: local
  redis_data:
    driver: local

networks:
  grounding-dino-network:
    driver: bridge
