events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=async:10m rate=100r/s;

    # Upstream backend servers with load balancing
    upstream grounding_dino_backend {
        least_conn;  # Load balancing method
        server grounding-dino-api-prod:8000 max_fails=3 fail_timeout=30s;
        # Add more API instances here if using docker-compose scale
        keepalive 32;
    }

    # Upstream for Flower monitoring
    upstream flower_backend {
        server grounding-dino-flower:5555;
    }

    # Main server block
    server {
        listen 80;
        server_name localhost ai-thailand.local;  # Update with your domain

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Robots-Tag noindex;

        # Client max body size for file uploads
        client_max_body_size 50M;
        client_body_timeout 60s;
        client_header_timeout 60s;

        # Main API endpoints
        location / {
            limit_req zone=api burst=50 nodelay;
            limit_req_status 429;

            proxy_pass http://grounding_dino_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout settings
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;  # 5 minutes for long-running detection tasks

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_max_temp_file_size 0;

            # Connection pooling
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Upload endpoints with different rate limits
        location ~ ^/detect/(upload|async/upload) {
            limit_req zone=upload burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://grounding_dino_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for file uploads
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 300s;

            # Larger buffers for file uploads
            proxy_request_buffering off;
            proxy_buffering off;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Async endpoints with higher rate limits
        location ~ ^/(detect/async|task|queue) {
            limit_req zone=async burst=200 nodelay;
            limit_req_status 429;

            proxy_pass http://grounding_dino_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Faster timeouts for async operations
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Health check endpoint (bypass rate limiting)
        location /health {
            access_log off;
            proxy_pass http://grounding_dino_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Documentation endpoints
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://grounding_dino_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Flower monitoring interface
        location /flower/ {
            proxy_pass http://flower_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /flower;

            # Authentication for flower (optional)
            # auth_basic "Flower Monitoring";
            # auth_basic_user_file /etc/nginx/.htpasswd;
        }

        # Status page for monitoring
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # Custom error pages
        error_page 429 @rate_limit_error;
        error_page 502 503 504 @maintenance_error;

        location @rate_limit_error {
            add_header Content-Type application/json always;
            return 429 '{"error": "Rate limit exceeded", "message": "Too many requests, please try again later"}';
        }

        location @maintenance_error {
            add_header Content-Type application/json always;
            return 503 '{"error": "Service temporarily unavailable", "message": "The AI service is currently processing other requests. Please try again in a moment."}';
        }
    }

    # HTTPS server (uncomment and configure for production with SSL)
    # server {
    #     listen 443 ssl http2;
    #     server_name ai-thailand.com;  # Update with your domain
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # HSTS header
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload";
    #
    #     # Include the same location blocks as HTTP server
    # }
}
